# S3 path components (ouro quality check)
s3_bucket: sgdai-data-lake
s3_prefix: ouro
s3_projeto: dw_2inst_ouro
s3_tabela: tb_tf_situacao_ejud

aws_profile: "tjrj"

# Data quality checks
date_col: "dthrmov"
not_null_cols:
  - coddoc
  - situacao

# Processing
outlier_multiplier: 1.5
max_rows: 1000000

# Oracle connection — credentials in AWS Secrets Manager or .env (see secrets_template.json)
# Local dev: set ORACLE_HOST, ORACLE_PORT, ORACLE_SERVICE_NAME, ORACLE_USER, ORACLE_PASSWORD in .env
# Production: stored in secret "2inst/relatorio-validador/credentials"

# Bronze vs Oracle row count reconciliation
# s3_path: relative path inside s3_bucket (no leading slash)
# oracle_table: SCHEMA.TABLE
bronze_tables:
  - s3_path: bronze/ejud/movimentorelator
    oracle_table: TJ01.MOVIMENTORELATOR
  - s3_path: bronze/ejud/movimento
    oracle_table: TJ01.MOVIMENTO
  - s3_path: bronze/ejud/t_processo
    oracle_table: TJ01.T_PROCESSO
  - s3_path: bronze/ejud/movdistribuicao
    oracle_table: TJ01.MOVDISTRIBUICAO
