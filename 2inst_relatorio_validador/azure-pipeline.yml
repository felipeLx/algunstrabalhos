trigger:
  branches:
    include:
      - prod
pool: 'Linux'
variables:
  AWS_REGION: 'sa-east-1'
  S3_BUCKET_NAME: 'sgdai-projetos'
  TIME: '2instancia'
  PROJETO: '2inst_relatorio_validador'
  ECR_REPO_NAME: '2inst-relatorio-validador'

steps:
- task: AWSCLI@1
  displayName: 'Sync scripts to S3'
  inputs:
    awsCredentials: 'AWS-Service-Connection'
    awsCommand: 's3'
    awsSubCommand: 'sync'
    awsArguments: >-
      .
      s3://$(S3_BUCKET_NAME)/$(TIME)/$(PROJETO)/
      --delete
      --exclude "*"
      --include "*.py"
      --include "*.yaml"
      --include "*.json"
      --include "requirements.txt"
      --include "Dockerfile"
      --include ".dockerignore"
    regionName: '$(AWS_REGION)'

- task: AWSShellScript@1
  displayName: 'ECR login, build and push Docker image'
  inputs:
    awsCredentials: 'AWS-Service-Connection'
    regionName: '$(AWS_REGION)'
    scriptType: 'inline'
    inlineScript: |
      set -e
      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      ECR_REPO="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/$(ECR_REPO_NAME)"
      echo "ECR: $ECR_REPO"
      aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO
      docker build -t $ECR_REPO:$(Build.BuildId) -t $ECR_REPO:latest .
      docker push $ECR_REPO:$(Build.BuildId)
      docker push $ECR_REPO:latest
