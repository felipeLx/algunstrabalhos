trigger:
  branches:
    include:
      - prod
pool: 'Linux'
variables:
  AWS_REGION: 'sa-east-1'  
  S3_BUCKET_NAME: 'sgdai-projetos'
  PROJETO: 'datajud_cnj'
steps:
- task: AWSCLI@1
  displayName: 'Sync DATAJUD_CONSULTAS'
  inputs:
    awsCredentials: 'AWS-Service-Connection'
    awsCommand: 's3'
    awsSubCommand: 'sync'
    awsArguments: 'consultas/ s3://$(S3_BUCKET_NAME)/$(PROJETO)/consultas/ --delete'
    regionName: '$(AWS_REGION)'
- task: AWSCLI@1
  displayName: 'Sync DATAJUD_SCRIPTS'
  inputs:
    awsCredentials: 'AWS-Service-Connection'
    awsCommand: 's3'
    awsSubCommand: 'sync'
    awsArguments: 'scripts/ s3://$(S3_BUCKET_NAME)/$(PROJETO)/scripts/ --delete'
    regionName: '$(AWS_REGION)'
- task: AWSCLI@1
  displayName: 'Sync DATAJUD_UTILS'
  inputs:
    awsCredentials: 'AWS-Service-Connection'
    awsCommand: 's3'
    awsSubCommand: 'sync'
    awsArguments: 'utils/ s3://$(S3_BUCKET_NAME)/$(PROJETO)/utils/ --delete'
    regionName: '$(AWS_REGION)'