trigger:
  branches:
    include:
      - prod
pool: 'Linux'
variables:
  AWS_REGION: 'sa-east-1'  
  S3_BUCKET_NAME: 'sgdai-projetos'
  TIME: '2instancia'
  PROJETO: '2inst_inspecao'
steps:
- task: AWSCLI@1
  displayName: 'Sync SCRIPTS_2INST_INSPECAO'
  inputs:
    awsCredentials: 'AWS-Service-Connection'
    awsCommand: 's3'
    awsSubCommand: 'sync'
    awsArguments: 'json/ s3://$(S3_BUCKET_NAME)/$(TIME)/$(PROJETO)/json/ --delete'
    regionName: '$(AWS_REGION)'
- task: AWSCLI@1
  displayName: 'Sync SCRIPTS_2INST_INSPECAO'
  inputs:
    awsCredentials: 'AWS-Service-Connection'
    awsCommand: 's3'
    awsSubCommand: 'sync'
    awsArguments: 'scripts/ s3://$(S3_BUCKET_NAME)/$(TIME)/$(PROJETO)/scripts/ --delete'
    regionName: '$(AWS_REGION)'
- task: AWSCLI@1
  displayName: 'Sync CONSULTAS_2INST_INSPECAO'
  inputs:
    awsCredentials: 'AWS-Service-Connection'
    awsCommand: 's3'
    awsSubCommand: 'sync'
    awsArguments: 'consultas/ s3://$(S3_BUCKET_NAME)/$(TIME)/$(PROJETO)/consultas/ --delete'
    regionName: '$(AWS_REGION)'